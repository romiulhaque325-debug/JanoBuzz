<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JanoBuzz</title><meta name="description" content=""><link rel="stylesheet" href="/style.css"></head><body><nav><a class="logo" href="/">Jano<span>Buzz</span></a><div class="links"><a href="/">Home</a><a href="/?cat=News">News</a><a href="/?cat=Technology">Technology</a><a href="/?cat=Education">Education</a><a href="/?cat=Lifestyle">Lifestyle</a></div><a class="admin" href="/admin.html">Admin</a></nav><main class="article"><div class="ad">ADVERTISEMENT</div><div id="article"></div><div class="ad">ADVERTISEMENT · In-article</div></main><footer>© JanoBuzz</footer><script>fetch("/api/posts/"+encodeURIComponent(new URLSearchParams(location.search).get("slug"))).then(r=>r.json()).then(p=>{document.title=p.seo_title||p.title;document.querySelector("meta[name=description]").content=p.meta_description||p.excerpt||"";article.innerHTML=`<small>${p.category} · ${p.language}</small><h1>${p.title}</h1>${p.cover_image?`<img class="cover" src="${p.cover_image}">`:""}<p>${p.excerpt||""}</p><div class="content">${p.content.replace(/\n/g,"<br>")}</div>`})</script></body></html>
