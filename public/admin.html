<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JanoBuzz Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="adminpage"><div id="login"><h1>JanoBuzz Admin</h1><input id="u" placeholder="Username"><input id="pw" type="password" placeholder="Password"><button onclick="doLogin()">Login</button><p id="err"></p></div><div id="dash" hidden><h1>Admin Dashboard</h1><button onclick="newPost()">+ New Post</button> <button onclick="logout()">Logout</button><section id="editor" hidden><input id="title" placeholder="Title"><select id="language"><option value="bn">বাংলা</option><option value="en">English</option><option value="hi">हिन्दी</option></select><select id="category"><option>News</option><option>Technology</option><option>Education</option><option>Lifestyle</option><option>Trending</option><option>How-To</option></select><input id="cover" placeholder="Cover image URL"><input id="image" type="file" accept="image/*"><input id="excerpt" placeholder="Short excerpt"><input id="seo" placeholder="SEO title"><input id="meta" placeholder="Meta description"><input id="tags" placeholder="Tags"><textarea id="content" placeholder="Write article..."></textarea><select id="status"><option value="draft">Save Draft</option><option value="published">Publish</option></select><button onclick="save()">Save</button></section><div id="list"></div></div></main><script>let editing=null;const ids=["title","cover","excerpt","seo","meta","tags","content"];async function doLogin(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:pw.value})});if(r.ok){login.hidden=true;dash.hidden=false;listPosts()}else err.textContent="Invalid login"}async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}async function listPosts(){editor.hidden=true;let d=await fetch("/api/posts?admin=1").then(r=>r.json());list.innerHTML="<table><tr><th>Title</th><th>Lang</th><th>Status</th><th>Action</th></tr>"+d.map(p=>`<tr><td>${p.title}</td><td>${p.language}</td><td>${p.status}</td><td><button onclick='editPost(${JSON.stringify(p)})'>Edit</button> <button onclick='del(${p.id})'>Delete</button></td></tr>`).join("")+"</table>"}function newPost(){editing=null;editor.hidden=false;ids.forEach(x=>document.getElementById(x).value="")}function editPost(p){editing=p.id;editor.hidden=false;title.value=p.title;cover.value=p.cover_image||"";excerpt.value=p.excerpt||"";seo.value=p.seo_title||"";meta.value=p.meta_description||"";tags.value=p.tags||"";content.value=p.content;language.value=p.language;category.value=p.category;status.value=p.status}async function save(){let c=cover.value;if(image.files[0]){let f=new FormData();f.append("image",image.files[0]);let r=await fetch("/api/upload",{method:"POST",body:f});c=(await r.json()).url}let d={title:title.value,language:language.value,category:category.value,cover_image:c,excerpt:excerpt.value,seo_title:seo.value,meta_description:meta.value,tags:tags.value,content:content.value,status:status.value};let r=await fetch(editing?"/api/posts/"+editing:"/api/posts",{method:editing?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)return alert((await r.json()).error);listPosts()}async function del(id){if(confirm("Delete?")){await fetch("/api/posts/"+id,{method:"DELETE"});listPosts()}}fetch("/api/me").then(r=>{if(r.ok){login.hidden=true;dash.hidden=false;listPosts()}})</script></body></html>
