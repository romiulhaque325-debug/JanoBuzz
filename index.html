<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JanoBuzz</title><meta name="description" content="News, Technology, Education and Lifestyle in Bangla, English and Hindi"><link rel="stylesheet" href="/style.css"></head><body><div class="top">JanoBuzz <span>বাংলা · English · हिन्दी</span></div><nav><a class="logo" href="/">Jano<span>Buzz</span></a><div class="links"><a href="/">Home</a><a href="?cat=News">News</a><a href="?cat=Technology">Technology</a><a href="?cat=Education">Education</a><a href="?cat=Lifestyle">Lifestyle</a></div><select id="lang"><option value="">All</option><option value="bn">বাংলা</option><option value="en">English</option><option value="hi">हिन्दी</option></select><a class="admin" href="/admin.html">Admin</a></nav><section class="hero"><div><h1>জানুন, শিখুন, এগিয়ে যান</h1><p>News, technology, education ও daily lifestyle—সব দরকারি তথ্য এক জায়গায়।</p><input id="search" placeholder="Search articles..."></div><div class="ad">ADVERTISEMENT</div></section><main><h2>Latest Stories</h2><div id="posts" class="grid"></div><div class="ad" style="margin-top:30px">ADVERTISEMENT · In-article</div></main><footer>© JanoBuzz · About · Contact · Privacy · Terms</footer><script>const params=new URLSearchParams(location.search),cat=params.get("cat");async function load(){let u="/api/posts"+(lang.value?"?language="+lang.value:""),d=await fetch(u).then(r=>r.json()),t=search.value.toLowerCase();d=d.filter(p=>(!cat||p.category===cat)&&(!t||[p.title,p.excerpt,p.content,p.tags].join(" ").toLowerCase().includes(t)));posts.innerHTML=d.map(p=>`<article class="card"><div class="thumb">${p.cover_image?`<img src="${p.cover_image}">`:"📰"}</div><div class="body"><small>${p.category} · ${p.language}</small><h3><a href="/post.html?slug=${encodeURIComponent(p.slug)}">${p.title}</a></h3><p>${p.excerpt||""}</p></div></article>`).join("")||"<p>No posts found.</p>"}lang.onchange=load;search.oninput=load;load();</script></body></html>
